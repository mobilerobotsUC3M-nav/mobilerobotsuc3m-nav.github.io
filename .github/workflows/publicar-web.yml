# Publica la web automáticamente cada vez que se sube un cambio a main.
# La web se genera en la rama gh-pages (no hace falta tocarla nunca a mano).
name: Publicar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar MkDocs
        run: pip install -r requirements.txt

      - name: Generar y publicar
        run: mkdocs gh-deploy --force
