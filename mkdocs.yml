# Configuración de la web del grupo.

site_name: Mobile Robots Group · Navegación
site_description: Recursos, tutoriales y guías de la división de navegación del Mobile Robots Group
site_url: https://mobilerobotsuc3m-nav.github.io/
repo_url: https://github.com/mobilerobotsUC3M-nav/mobilerobotsuc3m-nav.github.io
repo_name: mobilerobotsUC3M-nav/mobilerobotsuc3m-nav.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  icon:
    logo: material/robot-mower-outline
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    # Sin navigation.tabs ni navigation.sections: todo el índice va en el menú
    # de la izquierda y cada sección se abre y se cierra al pulsarla.
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow

nav:
  - Inicio: index.md
  - Tutoriales:
      - tutoriales/index.md
      - Git y GitHub:
          - 1. Primeros pasos: tutoriales/github/01-primeros-pasos.md
          - 2. Ramas y pull requests: tutoriales/github/02-ramas.md
          - 3. Buenas prácticas: tutoriales/github/03-buenas-practicas.md
      - "ROS 1 · Ubuntu 20.04 + Noetic":
          - tutoriales/ros1/index.md
          - 1. Instalar Ubuntu 20.04: tutoriales/ros1/ubuntu20.md
          - 2. Instalar ROS Noetic: tutoriales/ros1/instalar-noetic.md
          - 3. ROS en varios ordenadores: tutoriales/ros1/red.md
          - 4. Stack de navegación: tutoriales/ros1/navegacion.md
          - 5. Cámara RealSense: tutoriales/ros1/realsense.md
      - "ROS 2 · Ubuntu 24.04 + Jazzy":
          - tutoriales/ros2/index.md
          - 1. Instalar Ubuntu 24.04: tutoriales/ros2/ubuntu24.md
          - 2. Instalar ROS 2 Jazzy: tutoriales/ros2/instalar-jazzy.md
          - 3. Introducción a ROS 2: tutoriales/ros2/introduccion.md
          - 4. ROS 2 en varios ordenadores: tutoriales/ros2/red.md
          - 5. Navegación con Nav2: tutoriales/ros2/navegacion.md
          - 6. Cámara RealSense: tutoriales/ros2/realsense.md
  - Robots:
      - robots/index.md
      - TurtleBot 2: robots/turtlebot2.md
      - ADAM (base RB-1): robots/adam.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/menu.js

copyright: Mobile Robots Group · División de navegación
